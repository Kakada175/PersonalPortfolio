<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="foodBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09141f" />
      <stop offset="50%" stop-color="#0f293a" />
      <stop offset="100%" stop-color="#193b2a" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="20" flood-color="#000000" flood-opacity="0.5" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#foodBgGrad)" />

  <!-- Ambient Glows -->
  <circle cx="220" cy="180" r="130" fill="#10b981" opacity="0.25" filter="url(#glow)" />
  <circle cx="580" cy="320" r="140" fill="#f59e0b" opacity="0.2" filter="url(#glow)" />

  <!-- Center Mobile Phone Mockup -->
  <g transform="translate(275, 40)" filter="url(#shadow)">
    <!-- Phone Body -->
    <rect x="0" y="0" width="250" height="430" rx="36" fill="#090d16" stroke="#334155" stroke-width="4" />
    <!-- Dynamic Notch -->
    <rect x="85" y="12" width="80" height="18" rx="9" fill="#020617" />
    <!-- Screen Area -->
    <rect x="10" y="38" width="230" height="380" rx="26" fill="#0b1720" />

    <!-- App Header inside phone -->
    <text x="25" y="70" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#f8fafc">Khmer Foodie</text>
    <circle cx="215" cy="65" r="14" fill="#132a2c" />
    <text x="215" y="70" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#10b981">🍜</text>

    <!-- Search Bar in App -->
    <g transform="translate(20, 85)">
      <rect x="0" y="0" width="210" height="36" rx="10" fill="#152833" stroke="#234252" stroke-width="1" />
      <text x="15" y="23" font-family="sans-serif" font-size="11" fill="#64748b">Search Amok, Lok Lak...</text>
      <circle cx="192" cy="18" r="8" fill="#10b981" />
      <path d="M190 18 L194 18" stroke="#ffffff" stroke-width="1.5" />
    </g>

    <!-- Featured Food Card -->
    <g transform="translate(20, 135)">
      <rect x="0" y="0" width="210" height="135" rx="14" fill="#122530" stroke="#10b981" stroke-width="1.2" />
      <!-- Food image banner mockup -->
      <rect x="8" y="8" width="194" height="75" rx="10" fill="#1b3944" />
      <text x="105" y="52" font-family="sans-serif" font-size="28" text-anchor="middle">🍲</text>
      <rect x="15" y="15" width="55" height="18" rx="6" fill="rgba(16, 185, 129, 0.85)" />
      <text x="42" y="28" font-family="sans-serif" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">★ 4.9</text>
      <!-- Title & Details -->
      <text x="15" y="105" font-family="sans-serif" font-size="13" font-weight="bold" fill="#f8fafc">Traditional Fish Amok</text>
      <text x="15" y="122" font-family="sans-serif" font-size="11" font-weight="bold" fill="#10b981">$4.50</text>
      <circle cx="190" cy="115" r="12" fill="url(#emeraldGrad)" />
      <text x="190" y="119" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">+</text>
    </g>

    <!-- Second Food Item -->
    <g transform="translate(20, 280)">
      <rect x="0" y="0" width="210" height="75" rx="12" fill="#122530" stroke="#1f3b49" stroke-width="1" />
      <rect x="10" y="10" width="55" height="55" rx="10" fill="#1f3b49" />
      <text x="37" y="45" font-family="sans-serif" font-size="22" text-anchor="middle">🥩</text>
      <text x="75" y="32" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f8fafc">Beef Lok Lak</text>
      <text x="75" y="48" font-family="sans-serif" font-size="10" fill="#94a3b8">Stir-fried marinated beef</text>
      <text x="75" y="64" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f59e0b">$5.25</text>
    </g>

    <!-- Bottom Nav -->
    <g transform="translate(10, 370)">
      <rect x="0" y="0" width="230" height="48" rx="16" fill="#071017" />
      <circle cx="45" cy="24" r="5" fill="#10b981" />
      <circle cx="115" cy="24" r="16" fill="url(#emeraldGrad)" />
      <text x="115" y="29" font-family="sans-serif" font-size="13" fill="#ffffff" text-anchor="middle">🛒</text>
      <circle cx="185" cy="24" r="5" fill="#475569" />
    </g>
  </g>

  <!-- Left Floating Badge: Full-Stack Flutter + Laravel -->
  <g transform="translate(45, 160)" filter="url(#shadow)">
    <rect width="195" height="75" rx="16" fill="#0b1720" stroke="#10b981" stroke-width="1.5" />
    <circle cx="35" cy="37" r="18" fill="rgba(16,185,129,0.15)" />
    <text x="35" y="42" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#10b981">📱</text>
    <text x="65" y="36" font-family="sans-serif" font-size="13" font-weight="bold" fill="#f8fafc">Flutter Mobile</text>
    <text x="65" y="54" font-family="sans-serif" font-size="11" fill="#94a3b8">Dart &amp; Material 3</text>
  </g>

  <!-- Right Floating Badge: Laravel API & MySQL -->
  <g transform="translate(560, 240)" filter="url(#shadow)">
    <rect width="195" height="75" rx="16" fill="#0b1720" stroke="#f59e0b" stroke-width="1.5" />
    <circle cx="35" cy="37" r="18" fill="rgba(245,158,11,0.15)" />
    <text x="35" y="42" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#f59e0b">⚙️</text>
    <text x="65" y="36" font-family="sans-serif" font-size="13" font-weight="bold" fill="#f8fafc">Laravel &amp; MySQL</text>
    <text x="65" y="54" font-family="sans-serif" font-size="11" fill="#94a3b8">RESTful CRUD APIs</text>
  </g>
</svg>

