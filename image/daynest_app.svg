<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="20" flood-color="#000000" flood-opacity="0.5" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)" />

  <!-- Ambient Glows -->
  <circle cx="200" cy="150" r="120" fill="#8b5cf6" opacity="0.25" filter="url(#glow)" />
  <circle cx="600" cy="350" r="130" fill="#ec4899" opacity="0.2" filter="url(#glow)" />

  <!-- Center Mobile Phone Mockup -->
  <g transform="translate(275, 40)" filter="url(#shadow)">
    <!-- Phone Body -->
    <rect x="0" y="0" width="250" height="430" rx="36" fill="#090d16" stroke="#334155" stroke-width="4" />
    <!-- Dynamic Island / Speaker Notch -->
    <rect x="85" y="12" width="80" height="18" rx="9" fill="#020617" />
    <!-- Screen Area -->
    <rect x="10" y="38" width="230" height="380" rx="26" fill="#0f172a" />

    <!-- App Header inside phone -->
    <text x="25" y="70" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#f8fafc">DayNest</text>
    <circle cx="215" cy="65" r="14" fill="#1e293b" />
    <path d="M211 65 L219 65 M215 61 L215 69" stroke="#8b5cf6" stroke-width="2" stroke-linecap="round" />

    <!-- Date Strip -->
    <g transform="translate(20, 85)">
      <rect x="0" y="0" width="210" height="50" rx="12" fill="#1e293b" />
      <g transform="translate(15, 12)">
        <text x="12" y="14" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">MON</text>
        <text x="12" y="28" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f8fafc" text-anchor="middle">12</text>
      </g>
      <g transform="translate(55, 6)">
        <rect x="0" y="0" width="30" height="38" rx="8" fill="url(#primaryGrad)" />
        <text x="15" y="16" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">TUE</text>
        <text x="15" y="30" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">13</text>
      </g>
      <g transform="translate(95, 12)">
        <text x="12" y="14" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">WED</text>
        <text x="12" y="28" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f8fafc" text-anchor="middle">14</text>
      </g>
      <g transform="translate(135, 12)">
        <text x="12" y="14" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">THU</text>
        <text x="12" y="28" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f8fafc" text-anchor="middle">15</text>
      </g>
      <g transform="translate(175, 12)">
        <text x="12" y="14" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">FRI</text>
        <text x="12" y="28" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f8fafc" text-anchor="middle">16</text>
      </g>
    </g>

    <!-- Task Cards -->
    <g transform="translate(20, 150)">
      <rect x="0" y="0" width="210" height="60" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <rect x="12" y="15" width="6" height="30" rx="3" fill="#8b5cf6" />
      <text x="26" y="28" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f8fafc">Sprint Review &amp; UI</text>
      <text x="26" y="44" font-family="sans-serif" font-size="10" fill="#94a3b8">09:30 AM - 11:00 AM</text>
      <circle cx="190" cy="30" r="9" fill="#0f172a" stroke="#8b5cf6" stroke-width="2" />
      <path d="M187 30 L189 33 L194 28" stroke="#8b5cf6" stroke-width="2" stroke-linecap="round" fill="none" />
    </g>

    <g transform="translate(20, 220)">
      <rect x="0" y="0" width="210" height="60" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <rect x="12" y="15" width="6" height="30" rx="3" fill="#ec4899" />
      <text x="26" y="28" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f8fafc">Flutter State Management</text>
      <text x="26" y="44" font-family="sans-serif" font-size="10" fill="#94a3b8">02:00 PM - 04:30 PM</text>
      <circle cx="190" cy="30" r="9" fill="#0f172a" stroke="#475569" stroke-width="2" />
    </g>

    <g transform="translate(20, 290)">
      <rect x="0" y="0" width="210" height="55" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <rect x="12" y="15" width="6" height="25" rx="3" fill="#06b6d4" />
      <text x="26" y="27" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f8fafc">Client Presentation</text>
      <text x="26" y="42" font-family="sans-serif" font-size="10" fill="#94a3b8">05:00 PM - 06:00 PM</text>
    </g>

    <!-- Bottom Navigation Bar inside Phone -->
    <g transform="translate(10, 370)">
      <rect x="0" y="0" width="230" height="48" rx="16" fill="#090d16" />
      <circle cx="45" cy="24" r="5" fill="#8b5cf6" />
      <circle cx="115" cy="24" r="16" fill="url(#primaryGrad)" />
      <path d="M110 24 L120 24 M115 19 L115 29" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
      <circle cx="185" cy="24" r="5" fill="#64748b" />
    </g>
  </g>

  <!-- Left Floating Badge: Flutter Logo & Features -->
  <g transform="translate(50, 160)" filter="url(#shadow)">
    <rect width="180" height="75" rx="16" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.5" />
    <!-- Flutter Icon Mockup -->
    <path d="M35 22 L20 37 L30 47 L50 27 Z" fill="#02569B" />
    <path d="M30 47 L40 57 L50 47 L40 37 Z" fill="#0175C2" />
    <path d="M35 42 L25 52 L35 62 L45 52 Z" fill="#29B6F6" />
    <text x="65" y="38" font-family="sans-serif" font-size="13" font-weight="bold" fill="#f8fafc">Flutter &amp; Dart</text>
    <text x="65" y="55" font-family="sans-serif" font-size="11" fill="#94a3b8">Cross-Platform App</text>
  </g>

  <!-- Right Floating Badge: Provider & Themes -->
  <g transform="translate(570, 240)" filter="url(#shadow)">
    <rect width="180" height="75" rx="16" fill="#0f172a" stroke="#ec4899" stroke-width="1.5" />
    <circle cx="35" cy="37" r="18" fill="rgba(236,72,153,0.15)" />
    <text x="35" y="42" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#ec4899">⚡</text>
    <text x="65" y="38" font-family="sans-serif" font-size="13" font-weight="bold" fill="#f8fafc">Provider State</text>
    <text x="65" y="55" font-family="sans-serif" font-size="11" fill="#94a3b8">Dark &amp; Light Theme</text>
  </g>
</svg>

